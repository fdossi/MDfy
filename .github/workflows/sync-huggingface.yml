name: Sync backend to Hugging Face
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN" || (echo "Configure o secret HF_TOKEN" && exit 1)
          test -n "$HF_SPACE_ID" || (echo "Configure a variável HF_SPACE_ID" && exit 1)
      - name: Publish Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          git clone "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" /tmp/mdfy-space
          find /tmp/mdfy-space -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R backend/. /tmp/mdfy-space/
          cd /tmp/mdfy-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy MDfy API"
          git push
